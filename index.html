<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قارئ الزخم — آخر 15 شمعة</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#101820;--mut:#5b6773;--bd:#d9dee3;--up:#0e9f6e;--dn:#e02f44;--ac:#2b6cff;--wn:#c98a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161c24;--tx:#e8edf2;--mut:#93a0ad;--bd:#27313d;--up:#2ecc8f;--dn:#ff5c70;--ac:#5b8cff;--wn:#f0b429;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161c24;--tx:#e8edf2;--mut:#93a0ad;--bd:#27313d;--up:#2ecc8f;--dn:#ff5c70;--ac:#5b8cff;--wn:#f0b429;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
p.s{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
input[type=file]{display:none}
canvas{max-width:100%;border-radius:8px;display:block;margin:0 auto}
.sig{text-align:center;font-size:28px;font-weight:800;padding:14px;border-radius:12px;margin-bottom:10px}
.buy{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.sell{background:color-mix(in srgb,var(--dn) 18%,transparent);color:var(--dn)}
.watch{background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--wn)}
.none{background:var(--bg);color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.note{font-size:12px;color:var(--mut)}
.err{color:var(--dn);font-size:14px}
</style>
</head>
<body>
<main>
<h1>قارئ الزخم</h1>
<p class="s">ارفع لقطة شاشة للشارت، وسيقرأ الموقع آخر 15 شمعة ويعطي إشارة بناءً على الزخم فقط.</p>

<div class="card">
<label class="drop" for="f">اضغط لرفع لقطة الشارت<br><span class="note">شموع خضراء = صاعدة، حمراء = هابطة. الأفضل قص الصورة على منطقة الشموع فقط.</span></label>
<input id="f" type="file" accept="image/*">
</div>

<div id="out" hidden>
<div class="card"><div id="sig" class="sig"></div>
<div class="row"><span>قوة الزخم</span><b id="sc"></b></div>
<div class="bar"><i id="bar" style="width:0"></i></div>
<div id="det"></div></div>
<div class="card"><canvas id="cv"></canvas>
<p class="note" style="margin-bottom:0">المربعات حول الشموع الـ15 التي تمت قراءتها — تأكد أنها مطابقة للشارت.</p></div>
</div>
<p id="err" class="err"></p>
<p class="note">الدرجة مقياس لقوة الزخم وليست احتمال نجاح. لا تعتمد عليها وحدها، وجرّبها على الحساب التجريبي أولاً.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
$('f').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const img=new Image();
  img.onload=()=>run(img);
  img.onerror=()=>{$('err').textContent='تعذّر قراءة الصورة.'};
  img.src=URL.createObjectURL(file);
});

function run(img){
  $('err').textContent='';
  const sc=Math.min(1,1400/img.width), W=Math.round(img.width*sc), H=Math.round(img.height*sc);
  const cv=$('cv'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data;
  const cls=(x,y)=>{const i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2];
    if(g>r+30&&g>90&&g>b-15) return 1;      // أخضر
    if(r>g+45&&r>b+35&&r>110) return 2;     // أحمر
    return 0;};
  // 1) تصنيف الأعمدة
  const cols=[];
  for(let x=0;x<W;x++){
    let gc=0,rc=0,gmin=H,gmax=0,rmin=H,rmax=0;
    for(let y=0;y<H;y++){const c=cls(x,y);
      if(c===1){gc++;if(y<gmin)gmin=y;if(y>gmax)gmax=y;}
      else if(c===2){rc++;if(y<rmin)rmin=y;if(y>rmax)rmax=y;}}
    if(gc>=3&&gc>rc)cols.push({x,c:1,a:gmin,b:gmax});
    else if(rc>=3&&rc>gc)cols.push({x,c:2,a:rmin,b:rmax});
    else cols.push(null);
  }
  // 2) تجميع الأعمدة المتجاورة
  let groups=[],cur=null;
  for(let x=0;x<W;x++){const c=cols[x];
    if(c&&cur&&cur.c===c.c&&x-cur.x1<=1){cur.x1=x;cur.a=Math.min(cur.a,c.a);cur.b=Math.max(cur.b,c.b);}
    else{ if(cur)groups.push(cur); cur=c?{c:c.c,x0:x,x1:x,a:c.a,b:c.b}:null;}}
  if(cur)groups.push(cur);
  groups=groups.filter(g=>g.x1-g.x0+1>=3&&g.b-g.a>=3);
  if(groups.length<3){return fail('لم أجد شموعاً واضحة. تأكد من الألوان (أخضر/أحمر) وقصّ الصورة على الشارت.');}
  const ws=groups.map(g=>g.x1-g.x0+1).sort((a,b)=>a-b), med=ws[Math.floor(ws.length/2)];
  groups=groups.filter(g=>{const w=g.x1-g.x0+1;return w>=med*0.5&&w<=med*2.2;});
  if(groups.length<15){return fail('وجدت '+groups.length+' شمعة فقط، والمطلوب 15 على الأقل. قرّب الشارت أو قصّ الصورة.');}
  const last=groups.slice(-15);
  // 3) جسم الشمعة (الصفوف ذات العرض الكبير)
  const cs=last.map(g=>{
    const w=g.x1-g.x0+1; let bt=null,bb=null;
    for(let y=g.a;y<=g.b;y++){let n=0;for(let x=g.x0;x<=g.x1;x++)if(cls(x,y)===g.c)n++;
      if(n>=w*0.6){if(bt===null)bt=y;bb=y;}}
    if(bt===null){bt=bb=Math.round((g.a+g.b)/2);}
    const hi=H-g.a, lo=H-g.b, top=H-bt, bot=H-bb;
    const up=g.c===1;
    return {g,up,hi,lo,o:up?bot:top,c:up?top:bot};
  });
  // رسم المربعات
  ctx.lineWidth=2;
  cs.forEach(k=>{ctx.strokeStyle=k.up?'#00e676':'#ff5252';ctx.strokeRect(k.g.x0-2,k.g.a-2,k.g.x1-k.g.x0+5,k.g.b-k.g.a+5);});
  analyze(cs);
}
function fail(m){ $('err').textContent=m; $('out').hidden=true; }

function analyze(cs){
  const n=cs.length;
  const rng=cs.map(k=>Math.max(1,k.hi-k.lo));
  const body=cs.map(k=>k.c-k.o);
  const br=cs.map((k,i)=>Math.abs(body[i])/rng[i]);
  const avgR=rng.reduce((a,b)=>a+b,0)/n;
  const hi15=Math.max(...cs.map(k=>k.hi)), lo15=Math.min(...cs.map(k=>k.lo));
  const lastC=cs[n-1].c, pos=(lastC-lo15)/Math.max(1,hi15-lo15);
  // انحدار آخر 8 إغلاقات
  const m=8, ys=cs.slice(-m).map(k=>k.c), xm=(m-1)/2, ym=ys.reduce((a,b)=>a+b,0)/m;
  let sxy=0,sxx=0,sst=0;ys.forEach((y,i)=>{sxy+=(i-xm)*(y-ym);sxx+=(i-xm)**2;sst+=(y-ym)**2;});
  const slope=sxy/sxx, r2=sst?clamp((sxy*sxy)/(sxx*sst)):0;
  const res={};
  for(const dir of [1,-1]){
    const same=i=>(dir===1)===cs[i].up;
    const l6=[...Array(6)].map((_,j)=>n-6+j), l5=l6.slice(1);
    const frac=l6.filter(same).length/6;
    const s1=clamp((frac-0.5)/0.5)*25;
    const sb=l5.filter(same).map(i=>br[i]); const avgBr=sb.length?sb.reduce((a,b)=>a+b,0)/sb.length:0;
    const s2=clamp((avgBr-0.4)/0.4)*20;
    const s3=clamp(dir*slope*7/avgR/2)*20*(0.5+0.5*r2);
    const p=dir===1?pos:1-pos;
    const s4=clamp((p-0.5)/0.5)*15;
    const ab=a=>a.reduce((s,i)=>s+Math.abs(body[i]),0)/a.length;
    const rec=ab([n-3,n-2,n-1]), prv=ab([n-9,n-8,n-7,n-6,n-5,n-4]);
    const ratio=rec/Math.max(1,prv);
    const dirRec=[n-3,n-2,n-1].filter(same).length/3;
    const s5=clamp((ratio-0.8)/0.7)*20*dirRec;
    let pen=0;
    for(const i of [n-3,n-2,n-1]) if(!same(i)&&br[i]>0.6&&Math.abs(body[i])>1.2*Math.max(1,prv)) pen=20;
    res[dir]={t:Math.max(0,Math.round(s1+s2+s3+s4+s5-pen)),parts:[
      ['هيمنة لون الشموع (آخر 6)',s1,25],['قوة الأجسام (قليلة الذيول)',s2,20],
      ['ميل الإغلاقات (آخر 8)',s3,20],['الإغلاق قرب حافة النطاق',s4,15],
      ['تسارع الأجسام (آخر 3)',s5,20]],pen};
  }
  const dir=res[1].t>=res[-1].t?1:-1, r=res[dir], t=r.t;
  const el=$('sig');
  if(t>=65){el.className='sig '+(dir===1?'buy':'sell');el.textContent=dir===1?'▲ شراء — زخم صاعد':'▼ بيع — زخم هابط';}
  else if(t>=50){el.className='sig watch';el.textContent=(dir===1?'راقب الصعود':'راقب الهبوط')+' — الزخم يتشكّل';}
  else{el.className='sig none';el.textContent='لا إشارة — لا يوجد زخم كافٍ';}
  $('sc').textContent=t+' / 100';
  $('bar').style.width=t+'%';
  $('det').innerHTML=r.parts.map(p=>`<div class="row"><span>${p[0]}</span><b>${Math.round(p[1])} / ${p[2]}</b></div>`).join('')+
    (r.pen?`<div class="row"><span>عقوبة: شمعة مضادة قوية حديثة</span><b>−20</b></div>`:'')+
    `<p class="note" style="margin:8px 0 0">الإشارة تظهر عند 65 فأكثر، والمراقبة من 50 إلى 64.</p>`;
  $('out').hidden=false;
}
</script>
</body>
</html>
